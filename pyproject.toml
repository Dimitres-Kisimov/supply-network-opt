[project]
name = "supply-network-opt"
version = "1.0.0"
description = "Supply-network optimization: capacitated facility-location MILP + min-cost multi-echelon flow + multi-echelon safety stock, vs named baselines. Synthetic data."
authors = [{ name = "Dimitres Kisimov" }]
license = { text = "Proprietary" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
